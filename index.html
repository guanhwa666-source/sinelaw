<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="透過互動操作，逐步探索餘弦定理的推導與應用。" />
  <title>餘弦定理｜互動探索教具</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- JSX compiler -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    .animate-fade-in { animation: fadeIn .35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    select, input, button { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(99, 102, 241, .35);
      outline-offset: 2px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SuccessMessage = ({ children }) => (
      <div className="mt-4 flex items-start gap-2 rounded-xl border border-emerald-200 bg-emerald-50 p-4 font-medium text-emerald-800 animate-fade-in" role="status">
        <span aria-hidden="true" className="text-lg">✓</span>
        <span>{children}</span>
      </div>
    );

    const HintMessage = ({ children }) => (
      <div className="mt-4 flex items-start gap-2 rounded-xl border border-amber-200 bg-amber-50 p-4 text-amber-800 animate-fade-in" role="status">
        <span aria-hidden="true" className="text-lg">↻</span>
        <span>{children}</span>
      </div>
    );

    const StepHeading = ({ number, children }) => (
      <h2 className="mb-4 flex items-center text-2xl font-bold text-slate-800">
        <span className="mr-3 flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-indigo-100 text-lg text-indigo-700 shadow-sm">{number}</span>
        {children}
      </h2>
    );

    // Step 0: Initial thinking / engagement prompt
    const Step0 = () => {
      const [choice, setChoice] = useState(null);

      return (
        <div className="mx-auto max-w-3xl animate-fade-in text-center py-6">
          <StepHeading number="0">思考引導</StepHeading>
          <div className="mb-8 rounded-2xl border-2 border-indigo-100 bg-white p-8 shadow-sm text-left">
            <p className="text-xl font-bold text-slate-800 mb-4 text-center">
              如果我們已知 $\triangle ABC$ 的兩邊長 <span className="text-indigo-600">a</span>、<span className="text-indigo-600">b</span>，以及其夾角 <span className="text-amber-600">$\angle C$</span>：
            </p>
            <p className="text-lg text-slate-600 mb-8 text-center">
              你覺得有沒有辦法求出第三邊 <span className="text-pink-600 font-bold">c</span> 的長度呢？
            </p>
            
            <div className="flex justify-center gap-6">
              <button
                type="button"
                onClick={() => setChoice('yes')}
                className={`px-8 py-4 rounded-xl font-bold text-lg transition border-2 ${choice === 'yes' ? 'bg-emerald-600 text-white border-emerald-600 shadow-md scale-105' : 'bg-white text-slate-700 border-slate-200 hover:border-emerald-400 hover:bg-emerald-50'}`}
              >
                有辦法！
              </button>
              <button
                type="button"
                onClick={() => setChoice('no')}
                className={`px-8 py-4 rounded-xl font-bold text-lg transition border-2 ${choice === 'no' ? 'bg-amber-600 text-white border-amber-600 shadow-md scale-105' : 'bg-white text-slate-700 border-slate-200 hover:border-amber-400 hover:bg-amber-50'}`}
              >
                不知道 / 沒辦法
              </button>
            </div>

            {choice === 'yes' && (
              <div className="mt-8 p-5 bg-emerald-50 border border-emerald-200 rounded-xl text-emerald-800 animate-fade-in text-center">
                <p className="font-bold text-lg mb-1">太棒了！</p>
                <p>沒錯，我們確實可以透過坐標系與距離公式把它推導出來。接下來就讓我們一起一步步探索！</p>
              </div>
            )}

            {choice === 'no' && (
              <div className="mt-8 p-5 bg-indigo-50 border border-indigo-200 rounded-xl text-indigo-900 animate-fade-in text-center">
                <p className="font-bold text-lg mb-1">沒關係，這正是我們今天要探索的目標！</p>
                <p>當角度不是直角（無法直接用畢氏定理）時，我們需要用到「餘弦定理」。讓我們透過接下來的步驟來找出答案吧！</p>
              </div>
            )}
          </div>
        </div>
      );
    };

    // Step 1: place triangle ABC in the coordinate plane.
    const Step1 = () => {
      const [bx, setBx] = useState('');
      const [by, setBy] = useState('');
      const [ax, setAx] = useState('');
      const [ay, setAy] = useState('');
      const answered = Boolean(bx && by && ax && ay);
      const correct = bx === 'a' && by === '0' && ax === 'b cos C' && ay === 'b sin C';

      const bText = (bx !== '' && by !== '') ? ` (${bx}, ${by})` : '';
      const aText = (ax !== '' && ay !== '') ? ` (${ax}, ${ay})` : '';

      const selectClass = 'rounded-lg border-2 border-slate-200 bg-white p-2 text-center transition focus:border-indigo-500';

      return (
        <div className="grid gap-8 md:grid-cols-2 animate-fade-in">
          <div>
            <StepHeading number="1">將三角形放入坐標系</StepHeading>
            <p className="mb-4 leading-7 text-slate-600">
              將 △ABC 的頂點 C 放在原點 (0, 0)，並將邊 BC（長度為 a）放在 x 軸上。
            </p>
            <div className="mb-5 rounded-2xl border border-indigo-100 bg-white p-5 shadow-sm">
              <p className="mb-4 font-semibold text-indigo-800">根據右圖，選出點 A 和點 B 的坐標。</p>
              <div className="space-y-5">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="w-16 text-right font-bold">B = (</span>
                  <select aria-label="點 B 的 x 座標" value={bx} onChange={e => setBx(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="a">a</option><option value="b">b</option><option value="c">c</option>
                  </select>
                  <span>,</span>
                  <select aria-label="點 B 的 y 座標" value={by} onChange={e => setBy(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="0">0</option><option value="a">a</option>
                  </select>
                  <span>)</span>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="w-16 text-right font-bold">A = (</span>
                  <select aria-label="點 A 的 x 座標" value={ax} onChange={e => setAx(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="a cos C">a cos C</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                  </select>
                  <span>,</span>
                  <select aria-label="點 A 的 y 座標" value={ay} onChange={e => setAy(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="a sin C">a sin C</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                  </select>
                  <span>)</span>
                </div>
              </div>
              <p className="mt-4 text-sm text-slate-500">提示：點 A 到原點 C 的距離是 b，而 CA 與正 x 軸的夾角是 C。</p>
              {answered && (correct
                ? <SuccessMessage>完全正確！B = (a, 0)，A = (b cos C, b sin C)。</SuccessMessage>
                : <HintMessage>再檢查一次：B 在 x 軸上；點 A 的兩個坐標分別對應水平與垂直方向。</HintMessage>)}
            </div>
          </div>

          <div className="relative flex items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="pointer-events-none absolute inset-0 opacity-20" style={{backgroundImage: 'radial-gradient(#4f46e5 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
            <svg viewBox="0 0 320 220" className="relative z-10 w-full max-w-sm" role="img" aria-label="三角形 ABC 的坐標示意圖">
              <defs><marker id="arrow-step1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" /></marker></defs>
              <line x1="20" y1="175" x2="295" y2="175" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step1)" />
              <line x1="45" y1="200" x2="45" y2="18" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step1)" />
              <polygon points="45,175 235,175 140,55" fill="rgba(79,70,229,.10)" stroke="#4f46e5" strokeWidth="2.5" strokeLinejoin="round" />
              <circle cx="45" cy="175" r="5" fill="#f43f5e" />
              <circle cx="235" cy="175" r="5" fill={correct ? '#059669' : '#f43f5e'} />
              <circle cx="140" cy="55" r="5" fill={correct ? '#059669' : '#f43f5e'} />
              <text x="15" y="194" fontSize="11" fontWeight="700" fill="#334155">C (0, 0)</text>
              <text x="210" y="195" fontSize="12" fontWeight="700" fill="#334155">B{bText}</text>
              <text x="75" y="40" fontSize="11" fontWeight="700" fill="#334155">A{aText}</text>
              <text x="137" y="165" fontSize="14" fontWeight="700" fill="#4f46e5">a</text>
              <text x="74" y="107" fontSize="14" fontWeight="700" fill="#4f46e5">b</text>
              <text x="190" y="107" fontSize="14" fontWeight="700" fill="#db2777">c</text>
              <path d="M 72 175 A 27 27 0 0 0 66 158" fill="none" stroke="#f59e0b" strokeWidth="2" />
              <text x="78" y="164" fontSize="12" fontWeight="700" fill="#d97706">∠C</text>
            </svg>
          </div>
        </div>
      );
    };

    // Step 2: use the distance formula.
    const Step2 = () => {
      const [part1, setPart1] = useState('');
      const [part2, setPart2] = useState('');
      const answered = Boolean(part1 && part2);
      const correct = part1 === 'b cos C' && part2 === 'b sin C';
      const selectClass = 'min-w-[110px] rounded border-b-2 border-indigo-400 bg-indigo-50 px-2 py-1.5 text-center outline-none focus:bg-indigo-100 text-sm md:text-base';

      return (
        <div className="mx-auto max-w-5xl animate-fade-in">
          <StepHeading number="2">代入兩點距離公式</StepHeading>
          <p className="mb-6 text-lg leading-7 text-slate-600">
            已知 A = (b cos C, b sin C)，B = (a, 0)。利用兩點距離公式「距離² = (x₂ − x₁)² + (y₂ − y₁)²」，求邊長 c 的平方。
          </p>
          <div className="grid gap-8 lg:grid-cols-2 items-center">
            <div>
              <div className="rounded-2xl border-2 border-indigo-100 bg-white p-6 text-center shadow-sm">
                <p className="mb-5 font-semibold text-slate-700">將點 A 的坐標代入距離公式。</p>
                <div className="overflow-x-auto py-2">
                  <div className="inline-flex whitespace-nowrap items-center justify-center gap-1.5 font-mono text-base md:text-lg text-slate-800">
                    <span>c² = (</span>
                    <select aria-label="距離公式中的水平坐標" value={part1} onChange={e => setPart1(e.target.value)} className={selectClass}>
                      <option value="">選擇</option><option value="a">a</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                    </select>
                    <span>− a)² + (</span>
                    <select aria-label="距離公式中的垂直坐標" value={part2} onChange={e => setPart2(e.target.value)} className={selectClass}>
                      <option value="">選擇</option><option value="a">a</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                    </select>
                    <span>− 0)²</span>
                  </div>
                </div>
                {answered && (correct
                  ? <SuccessMessage>正確！因此 c² = (b cos C − a)² + (b sin C)²。</SuccessMessage>
                  : <HintMessage>再想一想：x 座標要放在第一個平方項，y 座標要放在第二個平方項。</HintMessage>)}
              </div>
              <div className="mt-5 rounded-xl bg-indigo-50 p-4 text-sm leading-6 text-indigo-900">
                <strong>思考：</strong>為什麼第二個平方項可以寫成 (b sin C)²？因為點 B 的 y 座標是 0。
              </div>
            </div>
            <div className="relative flex items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <div className="pointer-events-none absolute inset-0 opacity-20" style={{backgroundImage: 'radial-gradient(#4f46e5 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
              <svg viewBox="0 0 320 220" className="relative z-10 w-full max-w-sm" role="img" aria-label="兩點 A 與 B 的坐標與距離示意圖">
                <defs><marker id="arrow-step2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" /></marker></defs>
                <line x1="20" y1="175" x2="295" y2="175" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step2)" />
                <line x1="45" y1="200" x2="45" y2="18" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step2)" />
                <polygon points="45,175 235,175 140,55" fill="rgba(79,70,229,.05)" stroke="#c7d2fe" strokeWidth="1.5" strokeLinejoin="round" strokeDasharray="4,4" />
                <line x1="140" y1="55" x2="235" y2="175" stroke="#ec4899" strokeWidth="3" />
                <circle cx="45" cy="175" r="4" fill="#94a3b8" /><circle cx="235" cy="175" r="5" fill="#f43f5e" /><circle cx="140" cy="55" r="5" fill="#f43f5e" />
                <text x="14" y="194" fontSize="10" fill="#64748b">C (0, 0)</text>
                <text x="215" y="194" fontSize="11" fontWeight="700" fill="#334155">B (a, 0)</text>
                <text x="90" y="42" fontSize="10" fontWeight="700" fill="#334155">A (b cos C, b sin C)</text>
                <text x="175" y="105" fontSize="13" fontWeight="700" fill="#db2777">c</text>
              </svg>
            </div>
          </div>
        </div>
      );
    };

    // Step 3: expand and simplify.
    const Step3 = () => {
      const [ans, setAns] = useState('');
      const answered = ans.trim() !== '';
      const correct = ans.trim() === '1';

      return (
        <div className="mx-auto max-w-4xl animate-fade-in">
          <StepHeading number="3">展開與化簡</StepHeading>
          <p className="mb-6 text-lg leading-7 text-slate-600">接著將距離公式展開，並利用三角恆等式化簡。</p>
          <div className="mb-8 rounded-2xl border border-slate-200 bg-white p-6 shadow-sm md:p-8">
            <div className="mb-7 text-center font-mono">
              <p className="mb-3 font-sans text-xs font-bold tracking-widest text-slate-400">初始方程式</p>
              <p className="break-words text-lg md:text-xl">c² = (b cos C − a)² + (b sin C)²</p>
            </div>
            <div className="relative mt-6 border-t border-slate-100 pt-7">
              <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-white px-4 text-xs font-bold tracking-widest text-indigo-500">展開與整理</div>
              <div className="space-y-4 break-words text-center font-mono text-base text-slate-700 md:text-lg">
                <p>c² = b² cos² C − 2ab cos C + a² + b² sin² C</p>
                <p>c² = a² + b²(cos² C + sin² C) − 2ab cos C</p>
              </div>
            </div>
            <div className="relative mt-8 border-t border-slate-100 pt-7">
              <div className="absolute -top-3 left-1/2 -translate-x-1/2 bg-white px-4 text-xs font-bold tracking-widest text-pink-500">套用三角恆等式</div>
              <p className="mb-4 text-center text-sm leading-6 text-slate-600">基本三角恆等式告訴我們：cos² C + sin² C = 多少？</p>
              <div className="flex flex-wrap items-center justify-center gap-3 text-xl">
                <label htmlFor="identity-answer" className="font-mono text-indigo-900">cos² C + sin² C =</label>
                <input id="identity-answer" type="text" inputMode="numeric" value={ans} onChange={e => setAns(e.target.value)} disabled={correct} className={`w-20 rounded-lg border-2 p-2 text-center font-bold shadow-sm outline-none ${correct ? 'border-emerald-400 bg-emerald-50 text-emerald-700' : 'border-pink-300 focus:border-pink-500'}`} placeholder="?" />
              </div>
              {answered && (correct
                ? <SuccessMessage>正確！將 cos² C + sin² C = 1 代入，就能得到餘弦定理。</SuccessMessage>
                : <HintMessage>再檢查一次：對任何角 C，都有 sin² C + cos² C = 1。</HintMessage>)}
            </div>
          </div>
          {correct && (
            <div className="rounded-2xl border border-emerald-200 bg-gradient-to-br from-emerald-50 to-teal-50 p-7 text-center shadow-sm animate-fade-in">
              <h3 className="mb-3 text-xl font-bold text-emerald-800">推導完成！</h3>
              <p className="mb-5 leading-7 text-slate-700">我們得到餘弦定理：</p>
              <div className="inline-block rounded-xl border-2 border-indigo-100 bg-white px-5 py-4 font-mono text-xl font-bold text-indigo-700 shadow-sm md:px-8 md:text-3xl">c² = a² + b² − 2ab cos C</div>
              <p className="mt-5 text-sm leading-6 text-slate-600">當 ∠C = 90° 時，cos 90° = 0，因此 c² = a² + b²，便得到畢氏定理。</p>
            </div>
          )}
        </div>
      );
    };

    // Step 4: Formula transformation & derivation breakdown
    const Step4 = () => {
      return (
        <div className="mx-auto max-w-4xl animate-fade-in">
          <StepHeading number="4">公式變形與推導</StepHeading>
          <p className="mb-6 text-lg leading-7 text-slate-600">
            餘弦定理 <span className="font-mono font-semibold text-indigo-700">c² = a² + b² − 2ab cos C</span> 可以根據所求的邊或角進行代數變形。讓我們來看看如何一步步推導出求角的公式。
          </p>

          <div className="space-y-6">
            <div className="rounded-2xl border border-indigo-100 bg-white p-6 shadow-sm">
              <h3 className="mb-3 text-lg font-bold text-indigo-900">1. 邊長公式的變形（求任一邊）</h3>
              <p className="mb-4 text-slate-600">以夾角對應的邊公式為基礎，若想求其他邊（如邊 b 或邊 a），只要對調對應的字母與夾角即可：</p>
              <div className="grid gap-4 md:grid-cols-2 font-mono text-base">
                <div className="rounded-xl bg-slate-50 p-4 border border-slate-200">
                  <span className="text-xs font-sans font-bold text-indigo-600 block mb-1">求邊 b</span>
                  b² = a² + c² − 2ac cos B<br/>
                  <span className="text-xs font-sans text-slate-500 font-normal">（求出 b² 後再開根號得 b）</span>
                </div>
                <div className="rounded-xl bg-slate-50 p-4 border border-slate-200">
                  <span className="text-xs font-sans font-bold text-indigo-600 block mb-1">求邊 a</span>
                  a² = b² + c² − 2bc cos A
                </div>
              </div>
            </div>

            <div className="rounded-2xl border border-pink-100 bg-white p-6 shadow-sm">
              <h3 className="mb-3 text-lg font-bold text-pink-900">2. 角度公式的逐步推導（由三邊求角 $\cos A$）</h3>
              <p className="mb-4 text-slate-600">如果已知三角形的三邊長，想求出某個角（例如夾角 A），我們如何從餘弦定理一步步解出 <span className="font-mono text-pink-600 font-bold">cos A</span>？</p>
              
              <div className="space-y-4 font-mono text-sm md:text-base text-slate-700 bg-slate-50 p-5 rounded-xl border border-slate-200">
                <div className="flex items-start gap-3">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-pink-100 text-pink-700 text-xs font-sans font-bold flex items-center justify-center mt-0.5">①</span>
                  <div>
                    <span className="font-bold text-slate-800">從以角 A 對應邊 a 的餘弦定理出發：</span>
                    <div className="mt-1 text-indigo-900">a² = b² + c² − 2bc cos A</div>
                  </div>
                </div>

                <div className="flex items-start gap-3 border-t border-slate-200 pt-3">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-pink-100 text-pink-700 text-xs font-sans font-bold flex items-center justify-center mt-0.5">②</span>
                  <div>
                    <span className="font-bold text-slate-800">移項：將含有 $\cos A$ 的項移到左邊， $a^2$ 移到右邊</span>
                    <div className="mt-1 text-indigo-900">2bc cos A = b² + c² − a²</div>
                  </div>
                </div>

                <div className="flex items-start gap-3 border-t border-slate-200 pt-3">
                  <span className="flex-shrink-0 w-6 h-6 rounded-full bg-pink-100 text-pink-700 text-xs font-sans font-bold flex items-center justify-center mt-0.5">③</span>
                  <div>
                    <span className="font-bold text-slate-800">兩邊同除以 $2bc$，得到求角的最終公式：</span>
                    <div className="mt-2 inline-block bg-white px-4 py-2 rounded-lg border border-pink-200 text-pink-700 font-bold">
                      cos A = (b² + c² − a²) / (2bc)
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    };

    // Step 5: two separate application questions with independent answer states
    const Step5 = () => {
      const [ex1Ans, setEx1Ans] = useState('');
      const [ex2Ans, setEx2Ans] = useState('');
      const ex1Correct = ex1Ans.trim() !== '' && Number(ex1Ans) === 12;
      const ex2Correct = ex2Ans.trim() !== '' && Number(ex2Ans) === 120;
      const ex1Wrong = ex1Ans.trim() !== '' && !ex1Correct;
      const ex2Wrong = ex2Ans.trim() !== '' && !ex2Correct;

      return (
        <div className="animate-fade-in">
          <StepHeading number="5">概念穩固：互動習題</StepHeading>
          <div className="mb-7 flex items-start gap-3 rounded-xl border border-slate-200 bg-white p-5 text-slate-600 shadow-sm">
            <span className="rounded-lg bg-indigo-100 p-2 text-lg text-indigo-700" aria-hidden="true">i</span>
            <div>
              <p className="mb-1 font-semibold text-slate-800">公式運用提醒</p>
              <p className="text-sm leading-6">求邊長 b：b² = a² + c² − 2ac cos B，求出 b² 後再開平方根。<br />求角 A：cos A = (b² + c² − a²) / 2bc。</p>
            </div>
          </div>

          <div className="grid gap-6 md:grid-cols-2">
            {/* Exercise A */}
            <section className={`rounded-2xl border-2 p-5 transition-all md:p-6 ${ex1Correct ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white shadow-sm'}`} aria-labelledby="exercise-a-title">
              <h3 id="exercise-a-title" className="mb-4 flex items-center text-lg font-bold text-slate-800">
                <span className="mr-3 flex h-7 w-7 items-center justify-center rounded-md bg-sky-500 text-sm text-white">A</span>
                已知兩邊一夾角（SAS）
              </h3>
              <p className="mb-4 border-l-4 border-sky-300 pl-3 text-sm leading-6 text-slate-600">
                <span className="mb-1 block text-xs font-bold text-sky-700">課本動動筆 4</span>
                在 △ABC 中，已知 a = 4、c = 2，且 ∠B = 60°。求 b² 的值。<br />
                <span className="mt-1 inline-block text-slate-500">提示：cos 60° = 1/2。</span>
              </p>
              <div className="mb-5 rounded-xl border border-slate-100 bg-slate-50 p-4 font-mono text-sm leading-7 text-slate-600">
                b² = a² + c² − 2ac cos B<br />
                b² = 4² + 2² − 2(4)(2)(1/2)
              </div>
              <div className="mb-2 flex flex-wrap items-center gap-3">
                <label htmlFor="exercise-a-answer" className="text-lg font-bold text-slate-700">b² =</label>
                <input id="exercise-a-answer" type="number" inputMode="decimal" value={ex1Ans} onChange={e => setEx1Ans(e.target.value)} className="w-28 rounded-lg border-2 border-slate-300 p-2 text-center font-bold text-slate-800 focus:border-sky-500" placeholder="答案" />
              </div>
              {ex1Correct && <SuccessMessage>正確！b² = 12，所以 b = 2√3。</SuccessMessage>}
              {ex1Wrong && <HintMessage>再算一次：16 + 4 − 2 × 4 × 2 × 1/2。注意最後一項的減號。</HintMessage>}
              <div className="mt-5 flex justify-center rounded-xl border border-slate-100 bg-slate-50 p-3">
                <svg viewBox="0 0 180 125" className="w-full max-w-[190px]" role="img" aria-label="習題 A 三角形示意圖，角 B 為 60 度">
                  <polygon points="24,103 57,44 153,103" fill="rgba(14,165,233,.10)" stroke="#0ea5e9" strokeWidth="2" strokeLinejoin="round" />
                  <path d="M 42 103 A 18 18 0 0 0 34 87" fill="none" stroke="#0ea5e9" strokeWidth="2" />
                  <text x="41" y="94" fontSize="10" fontWeight="700" fill="#0369a1">60°</text>
                  <text x="13" y="116" fontSize="11" fontWeight="700" fill="#334155">B</text><text x="53" y="36" fontSize="11" fontWeight="700" fill="#334155">A</text><text x="157" y="116" fontSize="11" fontWeight="700" fill="#334155">C</text>
                  <text x="16" y="68" fontSize="10" fontWeight="700" fill="#0284c7">c = 2</text><text x="83" y="119" fontSize="10" fontWeight="700" fill="#0284c7">a = 4</text><text x="103" y="66" fontSize="10" fontWeight="700" fill="#db2777">b = ?</text>
                </svg>
              </div>
            </section>

            {/* Exercise B */}
            <section className={`rounded-2xl border-2 p-5 transition-all md:p-6 ${ex2Correct ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white shadow-sm'}`} aria-labelledby="exercise-b-title">
              <h3 id="exercise-b-title" className="mb-4 flex items-center text-lg font-bold text-slate-800">
                <span className="mr-3 flex h-7 w-7 items-center justify-center rounded-md bg-pink-500 text-sm text-white">B</span>
                已知三邊長求角度（SSS）
              </h3>
              <p className="mb-4 border-l-4 border-pink-300 pl-3 text-sm leading-6 text-slate-600">
                <span className="mb-1 block text-xs font-bold text-pink-700">課本例題 6</span>
                在 △ABC 中，已知 a = 7、b = 5、c = 3。求最大角 ∠A 的度數。
              </p>
              <div className="mb-5 rounded-xl border border-slate-100 bg-slate-50 p-4 font-mono text-sm leading-7 text-slate-600">
                cos A = (b² + c² − a²) / 2bc<br />
                cos A = (5² + 3² − 7²) / [2(5)(3)]<br />
                cos A = −1/2
              </div>
              <div className="mb-2 flex flex-wrap items-center gap-3">
                <label htmlFor="exercise-b-answer" className="text-lg font-bold text-slate-700">∠A =</label>
                <input id="exercise-b-answer" type="number" inputMode="decimal" value={ex2Ans} onChange={e => setEx2Ans(e.target.value)} className="w-28 rounded-lg border-2 border-slate-300 p-2 text-center font-bold text-slate-800 focus:border-pink-500" placeholder="角度" />
                <span className="font-semibold text-slate-500">度</span>
              </div>
              {ex2Correct && <SuccessMessage>答對了！cos A = −1/2，因此 ∠A = 120°。</SuccessMessage>}
              {ex2Wrong && <HintMessage>請回想特殊角的餘弦值：cos 60° = 1/2，而此題的餘弦值是負數。</HintMessage>}
              <div className="mt-5 flex justify-center rounded-xl border border-slate-100 bg-slate-50 p-3">
                <svg viewBox="0 0 180 125" className="w-full max-w-[190px]" role="img" aria-label="習題 B 三角形示意圖，角 A 為鈍角">
                  <polygon points="28,103 62,75 142,103" fill="rgba(236,72,153,.10)" stroke="#ec4899" strokeWidth="2" strokeLinejoin="round" />
                  <path d="M 50 84 A 19 19 0 0 1 82 84" fill="none" stroke="#ec4899" strokeWidth="2" />
                  <text x="60" y="96" fontSize="10" fontWeight="700" fill="#db2777">A = ?</text>
                  <text x="17" y="116" fontSize="11" fontWeight="700" fill="#334155">B</text><text x="145" y="116" fontSize="11" fontWeight="700" fill="#334155">C</text><text x="58" y="67" fontSize="11" fontWeight="700" fill="#334155">A</text>
                  <text x="37" y="82" fontSize="10" fontWeight="700" fill="#475569">c = 3</text><text x="100" y="82" fontSize="10" fontWeight="700" fill="#475569">b = 5</text><text x="82" y="119" fontSize="10" fontWeight="700" fill="#475569">a = 7</text>
                </svg>
              </div>
            </section>
          </div>

          {ex1Correct && ex2Correct && (
            <div className="mt-8 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 p-7 text-center text-white shadow-lg animate-fade-in">
              <h3 className="mb-3 text-2xl font-bold">🎉 恭喜你完成探索！</h3>
              <p className="leading-7 text-indigo-100">你已經練習了餘弦定理的推導與應用：既可以由兩邊和夾角求第三邊，也可以由三邊求角度。</p>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [step, setStep] = useState(0);
      const steps = ['0. 思考引導', '1. 建立坐標系', '2. 距離公式', '3. 展開與化簡', '4. 公式變形推導', '5. 概念穩固'];
      const StepComponents = [Step0, Step1, Step2, Step3, Step4, Step5];
      const CurrentStep = StepComponents[step];

      return (
        <main className="min-h-screen p-3 md:p-8">
          <div className="mx-auto w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-100 bg-white shadow-2xl">
            <header className="relative overflow-hidden bg-slate-900 p-7 text-center text-white md:p-9">
              <div className="absolute -right-20 -top-24 h-64 w-64 rounded-full bg-indigo-500 opacity-30 blur-3xl"></div>
              <div className="absolute -bottom-24 -left-20 h-64 w-64 rounded-full bg-pink-500 opacity-30 blur-3xl"></div>
              <h1 className="relative z-10 mb-3 text-3xl font-extrabold tracking-tight md:text-4xl">餘弦定理互動探索</h1>
            </header>

            <nav aria-label="活動步驟" className="flex overflow-x-auto border-b border-slate-200 bg-slate-50">
              {steps.map((label, index) => (
                <button key={label} type="button" onClick={() => setStep(index)} aria-current={step === index ? 'step' : undefined}
                  className={`min-w-[120px] flex-1 border-b-4 px-3 py-4 text-sm font-bold transition ${step === index ? 'border-indigo-600 bg-white text-indigo-700' : 'border-transparent text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}>
                  {label}
                </button>
              ))}
            </nav>

            <section className="min-h-[470px] p-5 md:p-9" aria-live="polite">
              <CurrentStep key={step} />
            </section>

            <footer className="flex items-center justify-between border-t border-slate-200 bg-slate-50 p-5 md:p-6">
              <button type="button" onClick={() => setStep(current => Math.max(0, current - 1))} disabled={step === 0}
                className={`rounded-xl px-5 py-3 font-bold transition ${step === 0 ? 'cursor-not-allowed bg-slate-200 text-slate-400' : 'border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-100'}`}>
                上一步
              </button>
              <span className="text-sm text-slate-500">第 {step + 1} / 6 步</span>
              <button type="button" onClick={() => setStep(current => Math.min(5, current + 1))} disabled={step === 5}
                className={`rounded-xl px-5 py-3 font-bold shadow-sm transition ${step === 5 ? 'cursor-not-allowed bg-slate-200 text-slate-400 shadow-none' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                下一步
              </button>
            </footer>
          </div>
          <p className="mx-auto mt-4 max-w-5xl px-2 text-center text-xs leading-5 text-slate-500">本活動使用互動選單與輸入欄位，協助學生檢查推導步驟及練習餘弦定理。請使用可連線至網路的瀏覽器開啟此檔案。</p>
        </main>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
