<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="透過互動操作，逐步探索餘弦定理的推導與應用。" />
  <title>餘弦定理｜互動探索教具</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React and ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- JSX compiler -->
  <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    body { font-family: 'Inter', 'Noto Sans TC', sans-serif; }
    .animate-fade-in { animation: fadeIn .35s ease-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(7px); }
      to { opacity: 1; transform: translateY(0); }
    }
    select, input, button { font: inherit; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 3px solid rgba(99, 102, 241, .35);
      outline-offset: 2px;
    }
    .fraction {
      display: inline-flex;
      flex-direction: column;
      vertical-align: middle;
      text-align: center;
      padding: 0 4px;
    }
    .fraction .num {
      border-bottom: 2px solid currentColor;
      padding-bottom: 2px;
    }
    .fraction .den {
      padding-top: 2px;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-indigo-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const SuccessMessage = ({ children }) => (
      <div className="mt-4 flex items-start gap-2 rounded-xl border border-emerald-200 bg-emerald-50 p-4 font-medium text-emerald-800 animate-fade-in" role="status">
        <span aria-hidden="true" className="text-lg">✓</span>
        <span>{children}</span>
      </div>
    );

    const HintMessage = ({ children }) => (
      <div className="mt-4 flex items-start gap-2 rounded-xl border border-amber-200 bg-amber-50 p-4 text-amber-800 animate-fade-in" role="status">
        <span aria-hidden="true" className="text-lg">↻</span>
        <span>{children}</span>
      </div>
    );

    const StepHeading = ({ number, children }) => (
      <h2 className="mb-4 flex items-center text-2xl font-bold text-slate-800">
        <span className="mr-3 flex h-9 w-9 flex-shrink-0 items-center justify-center rounded-full bg-indigo-100 text-lg text-indigo-700 shadow-sm">{number}</span>
        {children}
      </h2>
    );

    // Step 0: Pure thinking prompt with a dynamic triangle toggle or preview
    const Step0 = () => {
      const [triangleType, setTriangleType] = useState('acute'); // 'acute' | 'obtuse'

      return (
        <div className="mx-auto max-w-4xl animate-fade-in py-2">
          <StepHeading number="0">思考引導</StepHeading>
          
          <div className="grid gap-6 md:grid-cols-2 items-center mb-6">
            <div className="rounded-2xl border-2 border-indigo-100 bg-white p-6 shadow-sm">
              <p className="text-lg font-bold text-slate-800 mb-3">
                如果我們已知 ΔABC 的兩邊長 a、b，以及其夾角 ∠C：
              </p>
              <p className="text-base leading-7 text-indigo-700 font-bold mb-4">
                思考問題：你會用什麼方法求出第三邊 c 的長度呢？
              </p>
              <div className="flex gap-2 mb-4">
                <button
                  type="button"
                  onClick={() => setTriangleType('acute')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${triangleType === 'acute' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  銳角三角形模式
                </button>
                <button
                  type="button"
                  onClick={() => setTriangleType('obtuse')}
                  className={`px-3 py-1.5 rounded-lg text-xs font-bold transition ${triangleType === 'obtuse' ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}`}
                >
                  鈍角三角形模式
                </button>
              </div>
              <p className="text-sm text-slate-500 leading-6 border-t border-slate-100 pt-3">
                💡 不論三角形是銳角還是鈍角，當夾角不是直角時，我們都可以透過建立坐標系與兩點距離公式來推導出「餘弦定理」。
              </p>
            </div>

            <div className="relative flex items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <div className="pointer-events-none absolute inset-0 opacity-20" style={{backgroundImage: 'radial-gradient(#4f46e5 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
              <svg viewBox="0 0 300 200" className="relative z-10 w-full max-w-xs transition-all duration-300" role="img" aria-label="三角形 ABC 思考引導示意圖">
                {triangleType === 'acute' ? (
                  <polygon points="50,150 250,150 160,40" fill="rgba(79,70,229,.08)" stroke="#4f46e5" strokeWidth="2.5" strokeLinejoin="round" />
                ) : (
                  <polygon points="50,150 260,150 110,50" fill="rgba(79,70,229,.08)" stroke="#4f46e5" strokeWidth="2.5" strokeLinejoin="round" />
                )}
                <circle cx="50" cy="150" r="4" fill="#334155" />
                <circle cx={triangleType === 'acute' ? '250' : '260'} cy="150" r="4" fill="#334155" />
                <circle cx={triangleType === 'acute' ? '160' : '110'} cy={triangleType === 'acute' ? '40' : '50'} r="4" fill="#334155" />
                <text x="35" y="165" fontSize="12" fontWeight="700" fill="#334155">C</text>
                <text x={triangleType === 'acute' ? '255' : '265'} y="165" fontSize="12" fontWeight="700" fill="#334155">B</text>
                <text x={triangleType === 'acute' ? '150' : '98'} y={triangleType === 'acute' ? '30' : '42'} fontSize="12" fontWeight="700" fill="#334155">A</text>
                <text x={triangleType === 'acute' ? '100' : '70'} y={triangleType === 'acute' ? '95' : '95'} fontSize="13" fontWeight="700" fill="#4f46e5">b</text>
                <text x={triangleType === 'acute' ? '215' : '190'} y={triangleType === 'acute' ? '95' : '105'} fontSize="13" fontWeight="700" fill="#db2777">c = ?</text>
                <text x="145" y="168" fontSize="13" fontWeight="700" fill="#4f46e5">a</text>
                <path d={triangleType === 'acute' ? "M 70 150 A 25 25 0 0 0 64 133" : "M 75 150 A 25 25 0 0 0 68 127"} fill="none" stroke="#f59e0b" strokeWidth="2" />
                <text x="76" y="142" fontSize="11" fontWeight="700" fill="#d97706">∠C</text>
              </svg>
            </div>
          </div>

          <div className="p-4 bg-indigo-50 border border-indigo-200 rounded-xl text-indigo-900 text-center font-medium">
            請點擊下方「下一步」，讓我們一起開始建立坐標系推導吧！
          </div>
        </div>
      );
    };

    // Step 1: Coordinates step
    const Step1 = () => {
      const [bx, setBx] = useState('');
      const [by, setBy] = useState('');
      const [ax, setAx] = useState('');
      const [ay, setAy] = useState('');

      const bCorrect = bx === 'a' && by === '0';
      const aCorrect = ax === 'b cos C' && ay === 'b sin C';
      const allCorrect = bCorrect && aCorrect;
      const answered = Boolean(bx && by && ax && ay);

      const bHasChoice = bx !== '' && by !== '';
      const bWrong = bHasChoice && !bCorrect;

      const aHasChoice = ax !== '' && ay !== '';
      const aWrong = aHasChoice && !aCorrect;

      let wrongBX = 235, wrongBY = 175;
      if (bx === 'a' && by === 'a') { wrongBX = 235; wrongBY = 70; }
      else if (bx === 'b') { wrongBX = 140; wrongBY = 175; }
      else if (bx === 'c') { wrongBX = 90; wrongBY = 175; }

      let wrongAX = 140, wrongAY = 55;
      if (ax === 'a cos C') { wrongAX = 190; wrongAY = 55; }
      else if (ax === 'b sin C') { wrongAX = 85; wrongAY = 55; }
      if (ay === 'a sin C') { wrongAY = 35; }
      else if (ay === 'b cos C') { wrongAY = 115; }

      const bChoiceText = bHasChoice ? `(${bx}, ${by})` : '';
      const aChoiceText = aHasChoice ? `(${ax}, ${ay})` : '';

      const selectClass = 'rounded-lg border-2 border-slate-200 bg-white p-2 text-center transition focus:border-indigo-500';

      return (
        <div className="grid gap-8 md:grid-cols-2 animate-fade-in">
          <div>
            <StepHeading number="1">將三角形放入坐標系</StepHeading>
            <p className="mb-4 leading-7 text-slate-600">
              將 △ABC 的頂點 C 放在原點 (0, 0)，並將邊 BC（長度為 a）放在 x 軸上。
            </p>
            <div className="mb-5 rounded-2xl border border-indigo-100 bg-white p-5 shadow-sm">
              <p className="mb-4 font-semibold text-indigo-800">根據右圖，選出點 A 和點 B 的坐標。</p>
              <div className="space-y-5">
                <div className="flex flex-wrap items-center gap-2">
                  <span className="w-16 text-right font-bold">B = (</span>
                  <select aria-label="點 B 的 x 座標" value={bx} onChange={e => setBx(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="a">a</option><option value="b">b</option><option value="c">c</option>
                  </select>
                  <span>,</span>
                  <select aria-label="點 B 的 y 座標" value={by} onChange={e => setBy(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="0">0</option><option value="a">a</option>
                  </select>
                  <span>)</span>
                </div>
                <div className="flex flex-wrap items-center gap-2">
                  <span className="w-16 text-right font-bold">A = (</span>
                  <select aria-label="點 A 的 x 座標" value={ax} onChange={e => setAx(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="a cos C">a cos C</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                  </select>
                  <span>,</span>
                  <select aria-label="點 A 的 y 座標" value={ay} onChange={e => setAy(e.target.value)} className={selectClass}>
                    <option value="">選擇</option><option value="a sin C">a sin C</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                  </select>
                  <span>)</span>
                </div>
              </div>
              <p className="mt-4 text-sm text-slate-500">提示：可透過 A 點向 x 軸作垂線，利用直角三角形的三角比看出 x 與 y 坐標。</p>
              {answered && (allCorrect
                ? <SuccessMessage>完全正確！B = (a, 0)，A = (b cos C, b sin C)。</SuccessMessage>
                : <HintMessage>⚠️ 注意右圖：紅點代表你選錯的坐標，它沒有落在正確的頂點上！</HintMessage>)}
            </div>
          </div>

          <div className="relative flex items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
            <div className="pointer-events-none absolute inset-0 opacity-20" style={{backgroundImage: 'radial-gradient(#4f46e5 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
            <svg viewBox="0 0 320 220" className="relative z-10 w-full max-w-sm" role="img" aria-label="三角形 ABC 的坐標示意圖">
              <defs><marker id="arrow-step1" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" /></marker></defs>
              <line x1="20" y1="175" x2="295" y2="175" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step1)" />
              <line x1="45" y1="200" x2="45" y2="18" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step1)" />
              
              <line x1="140" y1="55" x2="140" y2="175" stroke="#ef4444" strokeWidth="1.5" strokeDasharray="4,4" opacity="0.6" />
              
              <polygon points="45,175 235,175 140,55" fill="rgba(79,70,229,.10)" stroke="#4f46e5" strokeWidth="2.5" strokeLinejoin="round" />
              
              <circle cx="45" cy="175" r="5" fill="#f43f5e" />
              <text x="15" y="194" fontSize="11" fontWeight="700" fill="#334155">C (0, 0)</text>

              <circle cx="140" cy="55" r="5" fill={aCorrect ? '#059669' : '#f43f5e'} />
              <text x="135" y="38" fontSize="11" fontWeight="700" fill="#334155">
                {aCorrect ? `A ${aChoiceText}` : 'A'}
              </text>

              {aWrong && (
                <g className="animate-fade-in">
                  <line x1="140" y1="55" x2={wrongAX} y2={wrongAY} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="3,3" />
                  <circle cx={wrongAX} cy={wrongAY} r="6" fill="#ef4444" />
                  <text x={wrongAX + 10} y={wrongAY - 4} fontSize="11" fontWeight="700" fill="#ef4444">選錯的 A {aChoiceText}</text>
                </g>
              )}

              <circle cx="235" cy="175" r="5" fill={bCorrect ? '#059669' : '#f43f5e'} />
              <text x="225" y="195" fontSize="12" fontWeight="700" fill="#334155">
                {bCorrect ? `B ${bChoiceText}` : 'B'}
              </text>

              {bWrong && (
                <g className="animate-fade-in">
                  <line x1="235" y1="175" x2={wrongBX} y2={wrongBY} stroke="#ef4444" strokeWidth="1.5" strokeDasharray="3,3" />
                  <circle cx={wrongBX} cy={wrongBY} r="6" fill="#ef4444" />
                  <text x={wrongBX + 10} y={wrongBY + 4} fontSize="11" fontWeight="700" fill="#ef4444">選錯的 B {bChoiceText}</text>
                </g>
              )}

              <text x="137" y="165" fontSize="14" fontWeight="700" fill="#4f46e5">a</text>
              <text x="74" y="107" fontSize="14" fontWeight="700" fill="#4f46e5">b</text>
              <text x="190" y="107" fontSize="14" fontWeight="700" fill="#db2777">c</text>
              <path d="M 72 175 A 27 27 0 0 0 66 158" fill="none" stroke="#f59e0b" strokeWidth="2" />
              <text x="78" y="164" fontSize="12" fontWeight="700" fill="#d97706">∠C</text>
            </svg>
          </div>
        </div>
      );
    };

    // Step 2: Distance formula step
    const Step2 = () => {
      const [part1, setPart1] = useState('');
      const [part2, setPart2] = useState('');
      const answered = Boolean(part1 && part2);
      const correct = part1 === 'b cos C' && part2 === 'b sin C';
      const selectClass = 'min-w-[110px] rounded border-b-2 border-indigo-400 bg-indigo-50 px-2 py-1.5 text-center outline-none focus:bg-indigo-100 text-sm md:text-base';

      return (
        <div className="mx-auto max-w-5xl animate-fade-in">
          <StepHeading number="2">代入兩點距離公式</StepHeading>
          <p className="mb-6 text-lg leading-7 text-slate-600">
            已知 A = (b cos C, b sin C)，B = (a, 0)。利用兩點距離公式「距離² = (x₂ − x₁)² + (y₂ − y₁)²」，求邊長 c 的平方。
          </p>
          <div className="grid gap-8 lg:grid-cols-2 items-center">
            <div>
              <div className="rounded-2xl border-2 border-indigo-100 bg-white p-6 text-center shadow-sm">
                <p className="mb-5 font-semibold text-slate-700">將點 A 的坐標代入距離公式。</p>
                <div className="overflow-x-auto py-2">
                  <div className="inline-flex whitespace-nowrap items-center justify-center gap-1.5 font-mono text-base md:text-lg text-slate-800">
                    <span>c² = (</span>
                    <select aria-label="距離公式中的水平坐標" value={part1} onChange={e => setPart1(e.target.value)} className={selectClass}>
                      <option value="">選擇</option><option value="a">a</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                    </select>
                    <span>− a)² + (</span>
                    <select aria-label="距離公式中的垂直坐標" value={part2} onChange={e => setPart2(e.target.value)} className={selectClass}>
                      <option value="">選擇</option><option value="a">a</option><option value="b cos C">b cos C</option><option value="b sin C">b sin C</option>
                    </select>
                    <span>− 0)²</span>
                  </div>
                </div>
                {answered && (correct
                  ? <SuccessMessage>正確！因此 c² = (b cos C − a)² + (b sin C)²。</SuccessMessage>
                  : <HintMessage>再想一想：x 座標要放在第一個平方項，y 座標要放在第二個平方項。</HintMessage>)}
              </div>
              <div className="mt-5 rounded-xl bg-indigo-50 p-4 text-sm leading-6 text-indigo-900">
                <strong>思考：</strong>為什麼第二個平方項可以寫成 (b sin C)²？因為點 B 的 y 座標是 0。
              </div>
            </div>
            <div className="relative flex items-center justify-center overflow-hidden rounded-2xl border border-slate-200 bg-white p-5 shadow-sm">
              <div className="pointer-events-none absolute inset-0 opacity-20" style={{backgroundImage: 'radial-gradient(#4f46e5 1px, transparent 1px)', backgroundSize: '20px 20px'}}></div>
              <svg viewBox="0 0 320 220" className="relative z-10 w-full max-w-sm" role="img" aria-label="兩點 A 與 B 的坐標與距離示意圖">
                <defs><marker id="arrow-step2" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8" /></marker></defs>
                <line x1="20" y1="175" x2="295" y2="175" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step2)" />
                <line x1="45" y1="200" x2="45" y2="18" stroke="#94a3b8" strokeWidth="2" markerEnd="url(#arrow-step2)" />
                <polygon points="45,175 235,175 140,55" fill="rgba(79,70,229,.05)" stroke="#c7d2fe" strokeWidth="1.5" strokeLinejoin="round" strokeDasharray="4,4" />
                <line x1="140" y1="55" x2="235" y2="175" stroke="#ec4899" strokeWidth="3" />
                <circle cx="45" cy="175" r="4" fill="#94a3b8" /><circle cx="235" cy="175" r="5" fill="#f43f5e" /><circle cx="140" cy="55" r="5" fill="#f43f5e" />
                <text x="14" y="194" fontSize="10" fill="#64748b">C (0, 0)</text>
                <text x="215" y="194" fontSize="11" fontWeight="700" fill="#334155">B (a, 0)</text>
                <text x="90" y="42" fontSize="10" fontWeight="700" fill="#334155">A (b cos C, b sin C)</text>
                <text x="175" y="105" fontSize="13" fontWeight="700" fill="#db2777">c</text>
              </svg>
            </div>
          </div>
        </div>
      );
    };

    // Step 3: Expanded to interactive choices for student participation
    const Step3 = () => {
      const [q1Choice, setQ1Choice] = useState(''); // expanding (b cos C - a)^2
      const [q2Choice, setQ2Choice] = useState(''); // applying trigonometric identity

      const q1Correct = q1Choice === 'correct_expansion';
      const q2Correct = q2Choice === 'correct_identity';

      return (
        <div className="mx-auto max-w-4xl animate-fade-in">
          <StepHeading number="3">展開與化簡（互動參與）</StepHeading>
          <p className="mb-6 text-lg leading-7 text-slate-600">透過下方兩個互動步驟，親自動手展開並化簡距離公式！</p>
          
          <div className="space-y-6">
            {/* Part 1: Expand binomial */}
            <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
              <h3 className="mb-3 text-base font-bold text-indigo-900">步驟 A：展開完全平方式 <span className="font-mono">(b cos C − a)²</span></h3>
              <p className="mb-4 text-sm text-slate-600">請選出將 <span className="font-mono">(b cos C − a)² + (b sin C)²</span> 正確展開後的結果：</p>
              
              <div className="space-y-3 font-mono text-sm">
                <label className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition ${q1Choice === 'wrong1' ? 'bg-rose-50 border-rose-300' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                  <input type="radio" name="q1" value="wrong1" checked={q1Choice === 'wrong1'} onChange={e => setQ1Choice(e.target.value)} />
                  <span>b² cos² C + a² + b² sin² C</span>
                </label>
                <label className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition ${q1Choice === 'correct_expansion' ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                  <input type="radio" name="q1" value="correct_expansion" checked={q1Choice === 'correct_expansion'} onChange={e => setQ1Choice(e.target.value)} />
                  <span>b² cos² C − 2ab cos C + a² + b² sin² C</span>
                </label>
              </div>
              {q1Choice === 'correct_expansion' && <SuccessMessage>答對了！包含交叉項 − 2ab cos C 才完整。</SuccessMessage>}
              {q1Choice === 'wrong1' && <HintMessage>漏掉了中間項喔！回想乘法公式 (x − y)² = x² − 2xy + y²。</HintMessage>}
            </div>

            {/* Part 2: Apply Identity */}
            {q1Correct && (
              <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm animate-fade-in">
                <h3 className="mb-3 text-base font-bold text-pink-900">步驟 B：合併同類項與套用三角恆等式</h3>
                <p className="mb-2 text-sm text-slate-600">將上式重新排列並把含有 <span className="font-mono">b²</span> 的項提出：</p>
                <div className="mb-4 p-3 bg-slate-50 rounded-xl font-mono text-center text-slate-700">
                  c² = a² + b²(cos² C + sin² C) − 2ab cos C
                </div>
                <p className="mb-4 text-sm text-slate-600">請問括號內的 <span className="font-mono">cos² C + sin² C</span> 可以化簡為什麼？</p>

                <div className="space-y-3 font-mono text-sm">
                  <label className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition ${q2Choice === 'wrong2' ? 'bg-rose-50 border-rose-300' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                    <input type="radio" name="q2" value="wrong2" checked={q2Choice === 'wrong2'} onChange={e => setQ2Choice(e.target.value)} />
                    <span>0</span>
                  </label>
                  <label className={`flex items-center gap-3 p-3.5 rounded-xl border cursor-pointer transition ${q2Choice === 'correct_identity' ? 'bg-emerald-50 border-emerald-300' : 'bg-slate-50 border-slate-200 hover:bg-slate-100'}`}>
                    <input type="radio" name="q2" value="correct_identity" checked={q2Choice === 'correct_identity'} onChange={e => setQ2Choice(e.target.value)} />
                    <span>1</span>
                  </label>
                </div>
                {q2Choice === 'correct_identity' && (
                  <div className="mt-5 rounded-xl border border-emerald-200 bg-emerald-50 p-5 text-center text-emerald-900 animate-fade-in">
                    <p className="font-bold text-lg mb-2">🎉 太棒了！餘弦定理公式順利出爐：</p>
                    <div className="inline-block bg-white px-6 py-3 rounded-lg font-mono text-xl font-bold text-indigo-700 shadow-sm border border-emerald-200">
                      c² = a² + b² − 2ab cos C
                    </div>
                  </div>
                )}
                {q2Choice === 'wrong2' && <HintMessage>提示：這是最重要的基本三角恆等式（平方關係），值為 1 喔！</HintMessage>}
              </div>
            )}
          </div>
        </div>
      );
    };

    // Step 4: Formula derivation with dynamic triangle representation
    const Step4 = () => {
      const [step2Choice, setStep2Choice] = useState('');
      const [step3Choice, setStep3Choice] = useState('');
      const [activeAngle, setActiveAngle] = useState('A'); // 'A' | 'B' | 'C'

      const step2Correct = step2Choice === '2bc_cosA';
      const step3Correct = step3Choice === 'divided_by_2bc';

      // Dynamic formula and sides based on active angle
      const getFormulaInfo = (angle) => {
        if (angle === 'A') return { side: 'a', other1: 'b', other2: 'c', sq: 'b² + c² − a²' };
        if (angle === 'B') return { side: 'b', other1: 'a', other2: 'c', sq: 'a² + c² − b²' };
        return { side: 'c', other1: 'a', other2: 'b', sq: 'a² + b² − c²' };
      };
      const info = getFormulaInfo(activeAngle);

      return (
        <div className="mx-auto max-w-4xl animate-fade-in">
          <StepHeading number="4">公式變形與視角切換</StepHeading>
          <p className="mb-6 text-lg leading-7 text-slate-600">
            餘弦定理可以根據你想求的「夾角」或「邊長」進行變形。點擊下方按鈕，看看對應不同頂點時公式的長相：
          </p>

          <div className="grid gap-6 md:grid-cols-3 mb-8">
            {['A', 'B', 'C'].map((ang) => (
              <button
                key={ang}
                type="button"
                onClick={() => setActiveAngle(ang)}
                className={`p-4 rounded-2xl border-2 text-center transition ${activeAngle === ang ? 'border-indigo-600 bg-indigo-50 shadow-sm' : 'border-slate-200 bg-white hover:border-slate-300'}`}
              >
                <div className="text-sm font-bold text-slate-500 mb-1">主目標：求角 {ang}</div>
                <div className="font-mono font-bold text-indigo-700">cos {ang}</div>
              </button>
            ))}
          </div>

          <div className="rounded-2xl border-2 border-indigo-100 bg-white p-6 shadow-sm mb-8">
            <h3 className="text-lg font-bold text-indigo-900 mb-2">當前焦點：以頂點 <span className="text-pink-600">∠{activeAngle}</span> 為出發點</h3>
            <p className="text-sm text-slate-600 mb-4">對應的邊長公式與角度公式：</p>
            <div className="grid gap-4 md:grid-cols-2 font-mono text-base">
              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                <span className="text-xs font-sans text-slate-500 block mb-1">邊長形式</span>
                {info.side}² = {info.other1}² + {info.other2}² − 2{info.other1}{info.other2} cos {activeAngle}
              </div>
              <div className="p-4 rounded-xl bg-pink-50 border border-pink-200">
                <span className="text-xs font-sans text-pink-600 font-bold block mb-1">角度形式</span>
                cos {activeAngle} = ({info.sq}) / (2{info.other1}{info.other2})
              </div>
            </div>
          </div>

          {/* Interactive derivation flow */}
          <div className="rounded-2xl border border-slate-200 bg-white p-6 shadow-sm">
            <h3 className="text-lg font-bold text-slate-800 mb-4">動手推導：由三邊長求 cos A</h3>
            
            <div className="space-y-6 font-mono text-sm md:text-base text-slate-700">
              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                <span className="font-sans font-bold text-slate-800 block mb-1">① 基本出發式：</span>
                a² = b² + c² − 2bc cos A
              </div>

              <div className="p-4 rounded-xl bg-slate-50 border border-slate-200">
                <span className="font-sans font-bold text-slate-800 block mb-3">② 移項：將含有 cos A 的項移至左邊，a² 移至右邊：</span>
                <div className="space-y-2 font-sans text-sm">
                  <label className={`flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition ${step2Choice === 'wrong1' ? 'bg-rose-50 border-rose-300' : 'bg-white border-slate-200 hover:bg-slate-100'}`}>
                    <input type="radio" name="step2" value="wrong1" checked={step2Choice === 'wrong1'} onChange={e => setStep2Choice(e.target.value)} />
                    <span className="font-mono">2bc cos A = a² − b² − c²</span>
                  </label>
                  <label className={`flex items-center gap-2 p-3 rounded-lg border cursor-pointer transition ${step2Choice === '2bc_cosA' ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-slate-200 hover:bg-slate-100'}`}>
                    <input type="radio" name="step2" value="2bc_cosA" checked={step2Choice === '2bc_cosA'} onChange={e => setStep2Choice(e.target.value)} />
                    <span className="font-mono">2bc cos A = b² + c² − a²</span>
                  </label>
                </div>
                {step2Choice === '2bc_cosA' && <SuccessMessage>正確！</SuccessMessage>}
              </div>

              {step2Correct && (
                <div className="p-4 rounded-xl bg-slate-50 border border-slate-200 animate-fade-in">
                  <span className="font-sans font-bold text-slate-800 block mb-3">③ 兩邊同除以 2bc 得到 cos A：</span>
                  <div className="space-y-3 font-sans text-sm">
                    <label className={`flex items-center gap-3 p-3.5 rounded-lg border cursor-pointer transition ${step3Choice === 'divided_by_2bc' ? 'bg-emerald-50 border-emerald-300' : 'bg-white border-slate-200 hover:bg-slate-100'}`}>
                      <input type="radio" name="step3" value="divided_by_2bc" checked={step3Choice === 'divided_by_2bc'} onChange={e => setStep3Choice(e.target.value)} />
                      <div className="flex items-center gap-2 flex-wrap">
                        <span>cos A =</span>
                        <span className="fraction font-mono font-bold">
                          <span className="num">b² + c² − a²</span>
                          <span className="den">2bc</span>
                        </span>
                      </div>
                    </label>
                    <label className={`flex items-center gap-3 p-3.5 rounded-lg border cursor-pointer transition ${step3Choice === 'wrong2' ? 'bg-rose-50 border-rose-300' : 'bg-white border-slate-200 hover:bg-slate-100'}`}>
                      <input type="radio" name="step3" value="wrong2" checked={step3Choice === 'wrong2'} onChange={e => setStep3Choice(e.target.value)} />
                      <span>兩邊同減 2bc</span>
                    </label>
                  </div>
                  {step3Choice === 'divided_by_2bc' && (
                    <SuccessMessage>完全掌握！順利推導完成。</SuccessMessage>
                  )}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    };

    // Step 5: Exercise with tiered hints & Submit Button to prevent instant error triggers
    const Step5 = () => {
      const [ex1Ans, setEx1Ans] = useState('');
      const [ex2Ans, setEx2Ans] = useState('');
      
      // Tiered hints level (0: hidden, 1: level 1 hint, 2: full step)
      const [hintLevel1, setHintLevel1] = useState(0);
      const [hintLevel2, setHintLevel2] = useState(0);

      // Submission states
      const [submitted1, setSubmitted1] = useState(false);
      const [submitted2, setSubmitted2] = useState(false);

      const appendSymbol = (sym) => {
        setEx1Ans(prev => prev + sym);
        setSubmitted1(false); // reset submission on change
      };

      const handleBackspace = () => {
        setEx1Ans(prev => prev.slice(0, -1));
        setSubmitted1(false);
      };

      const handleClear = () => {
        setEx1Ans('');
        setSubmitted1(false);
      };

      const checkEx1 = (val) => {
        const clean = val.replace(/\s+/g, '').toLowerCase();
        return clean === '2√3' || clean === '2sqrt3' || clean === '√12' || clean === 'sqrt12';
      };

      const num2 = Number(ex2Ans.trim());
      const ex1Correct = checkEx1(ex1Ans);
      const ex2Correct = !isNaN(num2) && num2 === 120;

      return (
        <div className="animate-fade-in">
          <StepHeading number="5">概念穩固：互動習題</StepHeading>
          <div className="mb-7 flex items-start gap-3 rounded-xl border border-slate-200 bg-white p-5 text-slate-600 shadow-sm">
            <span className="rounded-lg bg-indigo-100 p-2 text-lg text-indigo-700" aria-hidden="true">i</span>
            <div>
              <p className="mb-1 font-semibold text-slate-800">作答說明</p>
              <p className="text-sm">輸入答案後，請點擊對應的<strong>「提交答案」</strong>按鈕進行檢查。若卡住可點擊分級提示獲得協助。</p>
            </div>
          </div>

          <div className="grid gap-6 md:grid-cols-2">
            {/* Exercise A */}
            <section className={`rounded-2xl border-2 p-5 transition-all md:p-6 ${submitted1 && ex1Correct ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white shadow-sm'}`} aria-labelledby="exercise-a-title">
              <h3 id="exercise-a-title" className="mb-4 flex items-center text-lg font-bold text-slate-800">
                <span className="mr-3 flex h-7 w-7 items-center justify-center rounded-md bg-sky-500 text-sm text-white">A</span>
                已知兩邊一夾角求第三邊（SAS）
              </h3>
              <p className="mb-4 border-l-4 border-sky-300 pl-3 text-sm leading-6 text-slate-600">
                <span className="mb-1 block text-xs font-bold text-sky-700">課本動動筆 4</span>
                在 △ABC 中，已知 a = 4、c = 2，且 ∠B = 60°。求邊長 <strong>b</strong> 的長度。
              </p>

              {/* Tiered Hints */}
              <div className="mb-4">
                <div className="flex gap-2 mb-2">
                  <button
                    type="button"
                    onClick={() => setHintLevel1(prev => Math.min(2, prev + 1))}
                    className="py-1.5 px-3 rounded-lg border border-sky-200 bg-sky-50 text-sky-700 text-xs font-bold hover:bg-sky-100 transition shadow-sm"
                  >
                    💡 點我看分級提示 (目前等級 {hintLevel1}/2)
                  </button>
                  {hintLevel1 > 0 && (
                    <button type="button" onClick={() => setHintLevel1(0)} className="text-xs text-slate-400 underline">重置提示</button>
                  )}
                </div>
                {hintLevel1 === 1 && (
                  <div className="p-3 rounded-lg bg-sky-50 border border-sky-100 text-xs text-sky-900 animate-fade-in">
                    提示 1：請套用公式 <span className="font-mono">b² = a² + c² − 2ac cos B</span>，並帶入 a = 4, c = 2, cos 60° = 1/2。
                  </div>
                )}
                {hintLevel1 === 2 && (
                  <div className="p-3 rounded-lg bg-sky-50 border border-sky-100 text-xs text-sky-900 animate-fade-in font-mono">
                    提示 2：b² = 4² + 2² − 2(4)(2)(1/2) = 16 + 4 − 8 = 12 ➔ 故 b = √12 = 2√3。
                  </div>
                )}
              </div>

              {/* Input & Virtual Keypad */}
              <div className="mb-4 space-y-3">
                <div className="flex items-center gap-2">
                  <label htmlFor="exercise-a-answer" className="text-lg font-bold text-slate-700 whitespace-nowrap flex-shrink-0">b =</label>
                  <input id="exercise-a-answer" type="text" readOnly value={ex1Ans} className="min-w-0 flex-1 rounded-xl border-2 border-sky-200 bg-sky-50/50 p-2 text-center font-mono text-lg font-bold text-sky-900 shadow-inner outline-none" placeholder="點擊按鈕輸入" />
                  <button type="button" onClick={handleBackspace} className="flex-shrink-0 rounded-lg bg-slate-200 px-2.5 py-2 text-sm font-bold text-slate-700 hover:bg-slate-300 transition" title="退格">⌫</button>
                  <button type="button" onClick={handleClear} className="flex-shrink-0 rounded-lg bg-rose-100 px-2.5 py-2 text-sm font-bold text-rose-700 hover:bg-rose-200 transition" title="清空">清空</button>
                </div>

                <div className="grid grid-cols-5 gap-1.5 pt-1">
                  {['√2', '√3', '√5', '2', '3'].map((item) => (
                    <button
                      key={item}
                      type="button"
                      onClick={() => appendSymbol(item)}
                      className="rounded-xl border-2 border-sky-200 bg-white py-2 text-center font-mono text-base font-bold text-sky-800 shadow-sm transition hover:bg-sky-50 active:scale-95"
                    >
                      {item}
                    </button>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={() => setSubmitted1(true)}
                  className="w-full mt-2 py-2.5 rounded-xl bg-sky-600 text-white font-bold text-sm shadow-sm hover:bg-sky-700 transition"
                >
                  提交答案
                </button>
              </div>

              {submitted1 && (ex1Correct
                ? <SuccessMessage>正確！b = 2√3。</SuccessMessage>
                : <HintMessage>答案不正確，請再檢查計算過程或參考上方提示。</HintMessage>)}
            </section>

            {/* Exercise B */}
            <section className={`rounded-2xl border-2 p-5 transition-all md:p-6 ${submitted2 && ex2Correct ? 'border-emerald-300 bg-emerald-50' : 'border-slate-200 bg-white shadow-sm'}`} aria-labelledby="exercise-b-title">
              <h3 id="exercise-b-title" className="mb-4 flex items-center text-lg font-bold text-slate-800">
                <span className="mr-3 flex h-7 w-7 items-center justify-center rounded-md bg-pink-500 text-sm text-white">B</span>
                已知三邊長求角度（SSS）
              </h3>
              <p className="mb-4 border-l-4 border-pink-300 pl-3 text-sm leading-6 text-slate-600">
                <span className="mb-1 block text-xs font-bold text-pink-700">課本例題 6</span>
                在 △ABC 中，已知 a = 7、b = 5、c = 3。求最大角 ∠A 的度數。
              </p>

              {/* Tiered Hints */}
              <div className="mb-4">
                <div className="flex gap-2 mb-2">
                  <button
                    type="button"
                    onClick={() => setHintLevel2(prev => Math.min(2, prev + 1))}
                    className="py-1.5 px-3 rounded-lg border border-pink-200 bg-pink-50 text-pink-700 text-xs font-bold hover:bg-pink-100 transition shadow-sm"
                  >
                    💡 點我看分級提示 (目前等級 {hintLevel2}/2)
                  </button>
                  {hintLevel2 > 0 && (
                    <button type="button" onClick={() => setHintLevel2(0)} className="text-xs text-slate-400 underline">重置提示</button>
                  )}
                </div>
                {hintLevel2 === 1 && (
                  <div className="p-3 rounded-lg bg-pink-50 border border-pink-100 text-xs text-pink-900 animate-fade-in">
                    提示 1：最大角是相對最長邊 a = 7 的夾角 ∠A。請代入 <span className="font-mono">cos A = (b² + c² − a²) / (2bc)</span>。
                  </div>
                )}
                {hintLevel2 === 2 && (
                  <div className="p-3 rounded-lg bg-pink-50 border border-pink-100 text-xs text-pink-900 animate-fade-in font-mono">
                    提示 2：cos A = (5² + 3² − 7²) / (2 × 5 × 3) = (25 + 9 − 49) / 30 = −15/30 = −1/2。
                  </div>
                )}
              </div>

              <div className="mb-3 flex flex-wrap items-center gap-3">
                <label htmlFor="exercise-b-answer" className="text-lg font-bold text-slate-700 whitespace-nowrap flex-shrink-0">∠A =</label>
                <input id="exercise-b-answer" type="number" inputMode="decimal" value={ex2Ans} onChange={e => { setEx2Ans(e.target.value); setSubmitted2(false); }} className="w-28 rounded-lg border-2 border-slate-300 p-2 text-center font-bold text-slate-800 focus:border-pink-500" placeholder="角度" />
                <span className="font-semibold text-slate-500 whitespace-nowrap">度</span>
              </div>

              <button
                type="button"
                onClick={() => setSubmitted2(true)}
                className="w-full mb-3 py-2.5 rounded-xl bg-pink-600 text-white font-bold text-sm shadow-sm hover:bg-pink-700 transition"
              >
                提交答案
              </button>

              {submitted2 && (ex2Correct
                ? <SuccessMessage>答對了！cos A = −1/2，因此 ∠A = 120°。</SuccessMessage>
                : <HintMessage>答案不正確，請再檢查三角函數值與特殊角。</HintMessage>)}
            </section>
          </div>

          {submitted1 && ex1Correct && submitted2 && ex2Correct && (
            <div className="mt-8 rounded-2xl bg-gradient-to-r from-indigo-600 to-purple-600 p-7 text-center text-white shadow-lg animate-fade-in">
              <h3 className="mb-3 text-2xl font-bold">🎉 恭喜你完成探索！</h3>
              <p className="leading-7 text-indigo-100">你已經完全掌握了餘弦定理的推導過程與邊角計算應用！</p>
            </div>
          )}
        </div>
      );
    };

    const App = () => {
      const [step, setStep] = useState(0);
      const steps = ['0. 思考引導', '1. 建立坐標系', '2. 距離公式', '3. 展開與化簡', '4. 公式變形推導', '5. 概念穩固'];
      const StepComponents = [Step0, Step1, Step2, Step3, Step4, Step5];
      const CurrentStep = StepComponents[step];

      return (
        <main className="min-h-screen p-3 md:p-8">
          <div className="mx-auto w-full max-w-5xl overflow-hidden rounded-3xl border border-slate-100 bg-white shadow-2xl">
            <header className="relative overflow-hidden bg-slate-900 p-7 text-center text-white md:p-9">
              <div className="absolute -right-20 -top-24 h-64 w-64 rounded-full bg-indigo-500 opacity-30 blur-3xl"></div>
              <div className="absolute -bottom-24 -left-20 h-64 w-64 rounded-full bg-pink-500 opacity-30 blur-3xl"></div>
              <h1 className="relative z-10 mb-3 text-3xl font-extrabold tracking-tight md:text-4xl">餘弦定理互動探索</h1>
            </header>

            <nav aria-label="活動步驟" className="flex overflow-x-auto border-b border-slate-200 bg-slate-50">
              {steps.map((label, index) => (
                <button key={label} type="button" onClick={() => setStep(index)} aria-current={step === index ? 'step' : undefined}
                  className={`min-w-[120px] flex-1 border-b-4 px-3 py-4 text-sm font-bold transition ${step === index ? 'border-indigo-600 bg-white text-indigo-700' : 'border-transparent text-slate-400 hover:bg-slate-100 hover:text-slate-600'}`}>
                  {label}
                </button>
              ))}
            </nav>

            <section className="min-h-[470px] p-5 md:p-9" aria-live="polite">
              <CurrentStep key={step} />
            </section>

            <footer className="flex items-center justify-between border-t border-slate-200 bg-slate-50 p-5 md:p-6">
              <button type="button" onClick={() => setStep(current => Math.max(0, current - 1))} disabled={step === 0}
                className={`rounded-xl px-5 py-3 font-bold transition ${step === 0 ? 'cursor-not-allowed bg-slate-200 text-slate-400' : 'border-2 border-slate-200 bg-white text-slate-700 hover:bg-slate-100'}`}>
                上一步
              </button>
              <span className="text-sm text-slate-500">第 {step + 1} / 6 步</span>
              <button type="button" onClick={() => setStep(current => Math.min(5, current + 1))} disabled={step === 5}
                className={`rounded-xl px-5 py-3 font-bold shadow-sm transition ${step === 5 ? 'cursor-not-allowed bg-slate-200 text-slate-400 shadow-none' : 'bg-indigo-600 text-white hover:bg-indigo-700'}`}>
                下一步
              </button>
            </footer>
          </div>
          <p className="mx-auto mt-4 max-w-5xl px-2 text-center text-xs leading-5 text-slate-500">本活動使用互動選單與輸入欄位，協助學生檢查推導步驟及練習餘弦定理。請使用可連線至網路的瀏覽器開啟此檔案。</p>
        </main>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
